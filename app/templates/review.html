{% extends 'base.html' %}{% block title %}Отзыв · Конференции.РФ{% endblock %}{% block content %}<section class="form-card solo"><p class="eyebrow">ОБРАТНАЯ СВЯЗЬ</p><h1>Как всё прошло?</h1><p class="lead">{{ application.title }}</p><form method="post" data-validate><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="rating">Ваша оценка</label><select id="rating" name="rating" required><option value="">Выберите оценку</option>{% for i in range(5,0,-1) %}<option value="{{ i }}" {% if request.form.get('rating')==i|string %}selected{% endif %}>{{ i }} из 5</option>{% endfor %}</select><label for="text">Впечатления от события</label><textarea id="text" name="text" required minlength="10" maxlength="2000" rows="5" placeholder="Что запомнилось? Что можно улучшить?">{{ request.form.get('text','') }}</textarea><small>От 10 до 2000 символов</small><p class="form-error" aria-live="polite"></p><button class="button full" type="submit">Отправить отзыв ↗</button></form></section>{% endblock %}
