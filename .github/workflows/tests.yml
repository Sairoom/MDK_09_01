name: Portal tests
on: [push, pull_request]
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: conference_test
          MYSQL_ROOT_PASSWORD: testpassword
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/conference_test
