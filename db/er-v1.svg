<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="960" viewBox="0 0 1530 960"><rect width="1530" height="960" fill="#f7f8f2"/><text x="40" y="50" font-family="Arial" font-size="30" font-weight="bold">Конференции.РФ — ER-диаграмма v1</text><path d="M450 170 L500 170 L500 340 L560 340" fill="none" stroke="#6a7e6a" stroke-width="3"/><text x="467" y="247" font-size="17" font-family="Arial">1 : N</text><path d="M450 590 L520 590 L520 380 L560 380" fill="none" stroke="#6a7e6a" stroke-width="3"/><text x="466" y="577" font-size="17" font-family="Arial">1 : N</text><rect x="40" y="90" width="410" height="263" rx="12" fill="white" stroke="#bccab8"/><rect x="40" y="90" width="410" height="48" fill="#245b44"/><text x="58" y="123" fill="white" font-family="Arial" font-size="26" font-weight="bold">users</text><text x="58" y="168" font-family="Arial" font-size="20">PK id INTEGER</text><text x="58" y="201" font-family="Arial" font-size="20">UQ login VARCHAR(30)</text><text x="58" y="234" font-family="Arial" font-size="20">password_hash VARCHAR(255)</text><text x="58" y="267" font-family="Arial" font-size="20">UQ email VARCHAR(254)</text><text x="58" y="300" font-family="Arial" font-size="20">phone VARCHAR(16)</text><text x="58" y="333" font-family="Arial" font-size="20">role VARCHAR(16)</text><rect x="40" y="510" width="410" height="263" rx="12" fill="white" stroke="#bccab8"/><rect x="40" y="510" width="410" height="48" fill="#245b44"/><text x="58" y="543" fill="white" font-family="Arial" font-size="26" font-weight="bold">events</text><text x="58" y="588" font-family="Arial" font-size="20">PK id INTEGER</text><text x="58" y="621" font-family="Arial" font-size="20">title VARCHAR(160)</text><text x="58" y="654" font-family="Arial" font-size="20">starts_at VARCHAR(25) UTC</text><text x="58" y="687" font-family="Arial" font-size="20">place VARCHAR(160)</text><text x="58" y="720" font-family="Arial" font-size="20">description TEXT</text><text x="58" y="753" font-family="Arial" font-size="20">capacity INTEGER &gt; 0</text><rect x="560" y="250" width="410" height="329" rx="12" fill="white" stroke="#bccab8"/><rect x="560" y="250" width="410" height="48" fill="#245b44"/><text x="578" y="283" fill="white" font-family="Arial" font-size="26" font-weight="bold">applications</text><text x="578" y="328" font-family="Arial" font-size="20">PK id INTEGER</text><text x="578" y="361" font-family="Arial" font-size="20">FK user_id → users.id</text><text x="578" y="394" font-family="Arial" font-size="20">FK event_id → events.id</text><text x="578" y="427" font-family="Arial" font-size="20">status VARCHAR(16) legacy</text><text x="578" y="460" font-family="Arial" font-size="20">created_at VARCHAR(25) UTC</text><text x="578" y="493" font-family="Arial" font-size="20">payment VARCHAR(16)</text><text x="578" y="526" font-family="Arial" font-size="20">room VARCHAR(32)</text><text x="578" y="559" font-family="Arial" font-size="20">UQ user_id + event_id</text><text x="40" y="927" font-family="Arial" font-size="19">Исходная схема до нормализации статусов и добавления отзывов. Миграция сохраняет id и данные.</text></svg>